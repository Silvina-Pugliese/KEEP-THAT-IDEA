<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEEP-THAT-IDEA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%231c1c1c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js" defer></script>
</head>
<body>
<div class="window">

  <div class="titlebar">
    <div class="title"><span class="dot"></span>keep-that-idea</div>
    <div class="status" id="datetime">loading…</div>
  </div>

  <div class="toolbar">
    <div class="left">
      <button class="btn ghost" id="addPanelBtn" type="button" title="Add another panel">＋ add panel</button>
      <span class="panel-count" id="panelCount"></span>
    </div>
    <div class="support">
      <a href="https://buymeacoffee.com/silvinapugliese" target="_blank" rel="noopener">☕ tip the maker</a>
    </div>
  </div>

  <div class="panels" id="panels"></div>

  <div class="footer">
    <div class="hint">All content stays in your browser. Nothing is stored or sent anywhere.</div>
    <div class="buttons">
      <button class="btn danger" id="clearBtn" type="button" title="Clear the active panel">🗑 clear panel</button>
      <button class="btn" id="saveNotesBtn" type="button" title="Choose panels and format to save">⬇ save notes</button>
    </div>
  </div>
</div>

<!-- Save dialog -->
<div class="overlay" id="saveDialog">
  <div class="chooser">
    <h3>save notes</h3>
    <div class="panel-checklist" id="panelChecklist"></div>
    <div class="opts">
      <button class="btn" id="saveAsMd">save as .md</button>
      <button class="btn html" id="saveAsHtml">save as .html</button>
    </div>
    <button class="cancel" id="cancelSave">esc / cancel</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
